
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>마음 탐험소 | 나의 성격 알아보기</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Pretendard', 'Apple SD Gothic Neo',
        'Malgun Gothic', sans-serif;
      background: #fdf5f5;
      color: #514b5b;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 500px;
      background: white;
      border-radius: 28px;
      padding: 35px 25px;
      text-align: center;
      box-shadow: 0 10px 40px rgba(120, 90, 120, 0.08);
    }

    .logo {
      font-size: 15px;
      color: #b49acb;
      font-weight: bold;
      margin-bottom: 25px;
      letter-spacing: 2px;
    }

    .emoji {
      font-size: 75px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 27px;
      margin-bottom: 15px;
      color: #5c5068;
      line-height: 1.4;
    }

    .description {
      font-size: 15px;
      line-height: 1.8;
      color: #91899a;
      margin-bottom: 30px;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 16px;
      padding: 17px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
      font-family: inherit;
    }

    button:hover {
      transform: translateY(-2px);
    }

    .main-btn {
      background: #cbb5e8;
      color: white;
    }

    .answer-btn {
      background: #f8f3fc;
      color: #6d5b82;
      margin-bottom: 12px;
      text-align: left;
      padding: 18px;
    }

    .answer-btn:hover {
      background: #eee3f8;
    }

    .progress-area {
      margin-bottom: 25px;
      text-align: left;
      font-size: 13px;
      color: #a99ab8;
    }

    .progress-bar {
      height: 7px;
      background: #f1eaf6;
      border-radius: 10px;
      margin-top: 10px;
      overflow: hidden;
    }

    .progress {
      height: 100%;
      background: #cbb5e8;
      width: 0%;
      transition: 0.3s;
    }

    .result-box {
      background: #fbf7ff;
      border-radius: 20px;
      padding: 25px 15px;
      margin-bottom: 25px;
    }

    .result-emoji {
      font-size: 65px;
      margin-bottom: 15px;
    }

    .result-title {
      font-size: 24px;
      color: #8b70b1;
      margin-bottom: 15px;
    }

    .result-description {
      font-size: 15px;
      line-height: 1.9;
      color: #777080;
    }

    .secondary-btn {
      background: #f5f0fa;
      color: #8b70b1;
      margin-top: 12px;
    }

    .hidden {
      display: none;
    }

    @media (max-width: 400px) {
      .container {
        padding: 28px 20px;
      }

      h1 {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">✦ 마음 탐험소 ✦</div>

    <!-- 시작 화면 -->
    <section id="start-screen">
      <div class="emoji">🌷</div>

      <h1>
        나도 몰랐던<br>
        나의 성격은?
      </h1>

      <p class="description">
        간단한 질문에 답하고<br>
        나의 숨겨진 성격을 알아보세요!<br><br>
        약 1분이면 충분해요.
      </p>

      <button class="main-btn" onclick="startTest()">
        테스트 시작하기 →
      </button>
    </section>

    <!-- 질문 화면 -->
    <section id="quiz-screen" class="hidden">

      <div class="progress-area">
        <span id="question-number">질문 1 / 5</span>

        <div class="progress-bar">
          <div class="progress" id="progress"></div>
        </div>
      </div>

      <div class="emoji">💭</div>

      <h1 id="question"></h1>

      <p class="description">
        가장 나다운 답변을 선택해 주세요.
      </p>

      <div id="answers"></div>

    </section>

    <!-- 결과 화면 -->
    <section id="result-screen" class="hidden">

      <div class="emoji">✨</div>

      <h1>당신의 성격 결과</h1>

      <div class="result-box">

        <div class="result-emoji" id="result-emoji"></div>

        <div class="result-title" id="result-title"></div>

        <p class="result-description" id="result-description"></p>

      </div>

      <button class="main-btn" onclick="restartTest()">
        다시 테스트하기
      </button>

      <button class="secondary-btn" onclick="goHome()">
        처음으로 돌아가기
      </button>

    </section>

  </div>

  <script>
    const questions = [
      {
        question: "친구들과 약속이 없는 주말, 나는?",
        answers: [
          { text: "A. 친구들에게 먼저 연락한다", type: "E" },
          { text: "B. 혼자만의 시간을 즐긴다", type: "I" },
          { text: "C. 새로운 장소를 찾아간다", type: "E" },
          { text: "D. 집에서 편하게 쉰다", type: "I" }
        ]
      },

      {
        question: "새로운 일을 시작할 때 나는?",
        answers: [
          { text: "A. 일단 시작하고 본다", type: "P" },
          { text: "B. 계획부터 꼼꼼하게 세운다", type: "J" },
          { text: "C. 느낌이 가는 대로 한다", type: "P" },
          { text: "D. 순서대로 준비한다", type: "J" }
        ]
      },

      {
        question: "친구가 고민을 이야기한다면?",
        answers: [
          { text: "A. 해결 방법을 찾아준다", type: "T" },
          { text: "B. 친구의 마음에 공감한다", type: "F" },
          { text: "C. 현실적인 조언을 해준다", type: "T" },
          { text: "D. 따뜻하게 위로해 준다", type: "F" }
        ]
      },

      {
        question: "여행을 떠난다면 나는?",
        answers: [
          { text: "A. 유명한 명소를 찾아간다", type: "S" },
          { text: "B. 새로운 경험을 해보고 싶다", type: "N" },
          { text: "C. 맛집과 관광지를 즐긴다", type: "S" },
          { text: "D. 상상도 못 한 곳을 탐험한다", type: "N" }
        ]
      },

      {
        question: "내가 더 중요하게 생각하는 것은?",
        answers: [
          { text: "A. 논리와 객관적인 사실", type: "T" },
          { text: "B. 사람들의 감정과 관계", type: "F" },
          { text: "C. 효율적인 결과", type: "T" },
          { text: "D. 서로의 행복과 만족", type: "F" }
        ]
      }
    ];

    let currentQuestion = 0;
    let scores = {
      E: 0,
      I: 0,
      S: 0,
      N: 0,
      T: 0,
      F: 0,
      J: 0,
      P: 0
    };

    function startTest() {
      currentQuestion = 0;

      for (let type in scores) {
        scores[type] = 0;
      }

      showScreen("quiz-screen");
      showQuestion();
    }

    function showScreen(screenId) {
      document.getElementById("start-screen").classList.add("hidden");
      document.getElementById("quiz-screen").classList.add("hidden");
      document.getElementById("result-screen").classList.add("hidden");

      document.getElementById(screenId).classList.remove("hidden");
    }

    function showQuestion() {
      const q = questions[currentQuestion];

      document.getElementById("question-number").textContent =
        `질문 ${currentQuestion + 1} / ${questions.length}`;

      document.getElementById("progress").style.width =
        `${((currentQuestion + 1) / questions.length) * 100}%`;

      document.getElementById("question").textContent = q.question;

      const answersDiv = document.getElementById("answers");

      answersDiv.innerHTML = "";

      q.answers.forEach(answer => {
        const button = document.createElement("button");

        button.className = "answer-btn";
        button.textContent = answer.text;

        button.onclick = () => selectAnswer(answer.type);

        answersDiv.appendChild(button);
      });
    }

    function selectAnswer(type) {
      scores[type]++;

      currentQuestion++;

      if (currentQuestion < questions.length) {
        showQuestion();
      } else {
        showResult();
      }
    }

    function showResult() {
      const mbti =
        (scores.E >= scores.I ? "E" : "I") +
        (scores.S >= scores.N ? "S" : "N") +
        (scores.T >= scores.F ? "T" : "F") +
        (scores.J >= scores.P ? "J" : "P");

      const results = {
        "ISTJ": ["📚", "꼼꼼한 계획가", "당신은 책임감이 강하고 신중한 사람이에요. 계획을 세우고 차근차근 실천하는 것을 좋아해요."],
        "ISFJ": ["🌼", "따뜻한 수호자", "주변 사람들을 잘 챙기고 배려하는 따뜻한 성격이에요. 작은 약속도 소중하게 생각해요."],
        "INFJ": ["🌙", "깊은 생각의 몽상가", "깊이 생각하고 사람들의 마음을 이해하려고 노력해요. 자신만의 가치관이 뚜렷해요."],
        "INTJ": ["🔭", "전략적인 설계자", "논리적으로 생각하고 미래를 계획하는 것을 좋아해요. 새로운 아이디어를 발전시키는 데 능숙해요."],
        "ISTP": ["🛠️", "조용한 해결사", "문제가 생기면 침착하게 해결 방법을 찾아요. 직접 경험하고 배우는 것을 좋아해요."],
        "ISFP": ["🎨", "자유로운 예술가", "감수성이 풍부하고 자신만의 개성을 중요하게 생각해요. 일상 속 작은 행복을 잘 발견해요."],
        "INFP": ["🦋", "순수한 이상주의자", "상상력이 풍부하고 자신의 감정과 가치관을 소중하게 생각해요. 따뜻한 마음을 가지고 있어요."],
        "INTP": ["💡", "호기심 많은 탐구자", "새로운 지식을 알아가는 것을 좋아해요. 복잡한 문제를 분석하고 독창적인 생각을 하는 편이에요."],
        "ESTP": ["⚡", "에너지 넘치는 모험가", "활동적이고 도전을 즐겨요. 새로운 상황에서도 빠르게 적응하는 능력이 있어요."],
        "ESFP": ["🎉", "분위기 메이커", "밝고 활발하며 사람들과 함께하는 시간을 좋아해요. 주변에 즐거운 에너지를 전해요."],
        "ENFP": ["🌈", "열정적인 아이디어 뱅크", "창의적이고 새로운 가능성을 발견하는 것을 좋아해요. 사람들과 소통하며 에너지를 얻어요."],
        "ENTP": ["🚀", "창의적인 발명가", "독창적인 아이디어가 많고 새로운 도전을 즐겨요. 다양한 관점에서 문제를 바라봐요."],
        "ESTJ": ["📋", "든든한 리더", "체계적이고 책임감이 강해요. 목표를 세우고 사람들과 함께 성과를 만들어가는 것을 좋아해요."],
        "ESFJ": ["💗", "다정한 조력자", "사람들과의 관계를 중요하게 생각해요. 주변 사람들을 챙기고 함께하는 것을 좋아해요."],
        "ENFJ": ["🌻", "사람을 이끄는 리더", "다른 사람의 가능성을 발견하고 응원하는 것을 좋아해요. 따뜻한 리더십을 가지고 있어요."],
        "ENTJ": ["👑", "목표 지향적인 리더", "목표를 향해 적극적으로 나아가요. 효율적으로 계획하고 실행하는 능력이 뛰어나요."]
      };

      const result = results[mbti];

      document.getElementById("result-emoji").textContent = result[0];
      document.getElementById("result-title").textContent =
        `${mbti} · ${result[1]}`;

      document.getElementById("result-description").textContent =
        result[2];

      showScreen("result-screen");
    }

    function restartTest() {
      startTest();
    }

    function goHome() {
      showScreen("start-screen");
    }
  </script>

</body>
</html>
